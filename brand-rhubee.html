<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhubee — Indocolectivo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="section-tight">
  <div class="container">
    <div class="brand-feature">
      <div class="feature-bg" style="background:linear-gradient(120deg,#2B241F 0%,#5C4B3B 55%,#B99B72 140%)"></div>
      <div class="feature-scrim"></div>
      <div class="brand-feature-content">
        <img src="assets/logos/rhubee.jpg" alt="Rhubee">
        <p>Quiet luxury, made to last. Elegant essentials in refined silhouettes and muted palettes — fabric chosen for the way it ages, not just day one.</p>
      </div>
    </div>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="toolbar">
      <span class="toolbar-count" id="rhCount"></span>
      <div class="toolbar-controls">
        <div class="tag-list" id="rhChips">
          <button class="filter-chip active" data-category="all">All</button>
          <button class="filter-chip" data-category="T-Shirt">T-Shirt</button>
          <button class="filter-chip" data-category="Hoodie">Hoodie</button>
          <button class="filter-chip" data-category="Long Sleeve">Long Sleeve</button>
        </div>
        <select class="pill-select" id="rhSort">
          <option value="featured">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A–Z</option>
        </select>
      </div>
    </div>
    <div class="product-grid" id="rhGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/layout.js"></script>
<script src="js/products.js"></script>
<script src="js/shop.js"></script>
<script>
  renderLayout("brands");
  initListing({
    gridEl: document.getElementById("rhGrid"),
    sortEl: document.getElementById("rhSort"),
    chipWrap: document.getElementById("rhChips"),
    countEl: document.getElementById("rhCount"),
    baseList: getProductsByBrand("rhubee")
  });
</script>
</body>
</html>
