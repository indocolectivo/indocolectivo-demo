<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeBoujoux — Indocolectivo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="section-tight">
  <div class="container">
    <div class="brand-feature">
      <div class="feature-bg" style="background:#141414 url('assets/products/mz-1.jpg') center 20%/cover no-repeat;"></div>
      <div class="feature-scrim"></div>
      <div class="brand-feature-content">
        <img src="assets/logos/lebonjoux.png" alt="LeBoujoux">
        <p>Loud graphics, local streets. Jakarta streetwear built for bold statements — heavyweight cotton, oversized fits, and prints that don't ask for permission.</p>
      </div>
    </div>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="toolbar">
      <span class="toolbar-count" id="lbCount"></span>
      <div class="toolbar-controls">
        <div class="tag-list" id="lbChips">
          <button class="filter-chip active" data-category="all">All</button>
          <button class="filter-chip" data-category="T-Shirt">T-Shirt</button>
          <button class="filter-chip" data-category="Hoodie">Hoodie</button>
          <button class="filter-chip" data-category="Long Sleeve">Long Sleeve</button>
        </div>
        <select class="pill-select" id="lbSort">
          <option value="featured">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A–Z</option>
        </select>
      </div>
    </div>
    <div class="product-grid" id="lbGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/layout.js"></script>
<script src="js/products.js"></script>
<script src="js/shop.js"></script>
<script>
  renderLayout("brands");
  initListing({
    gridEl: document.getElementById("lbGrid"),
    sortEl: document.getElementById("lbSort"),
    chipWrap: document.getElementById("lbChips"),
    countEl: document.getElementById("lbCount"),
    baseList: getProductsByBrand("lebonjoux")
  });
</script>
</body>
</html>
